# Local one-command environment. Backend built via backend/Dockerfile, frontend
# served by Vite dev server in a node container.
# Usage: docker compose up --build  (or npm run docker:up)
services:
  backend:
    build: ./backend
    ports:
      - "4000:4000"
    environment:
      NODE_ENV: production
      PORT: 4000
      LOG_LEVEL: info
      DATABASE_URL: file:/data/app.db
      UPLOAD_DIR: /data/uploads
      JWT_SECRET: compose-dev-secret-change-me
      CORS_ORIGIN: http://localhost:5173
      OTP_MODE: console
      BILLING_CRON_ENABLED: "false"
    volumes:
      - data:/data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:4000/api/v1/health"]
      interval: 15s
      timeout: 5s
      retries: 5

  frontend:
    build: ./frontend
    environment:
      VITE_API_BASE_URL: http://localhost:4000
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  data:
